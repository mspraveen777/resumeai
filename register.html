<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ResumeAI — Create Account</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #1e1e2e;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --success: #43e97b;
    --error: #ff6584;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 80% 30%, rgba(108,99,255,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 20% 80%, rgba(255,101,132,0.08) 0%, transparent 60%);
    pointer-events: none;
  }
  .grid-bg {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(108,99,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(108,99,255,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }
  .container {
    width: 100%; max-width: 440px; padding: 24px;
    position: relative; z-index: 1;
    animation: fadeUp 0.6s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ✅ FIXED: matches index.html — stacks vertically, centered */
  .logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-bottom: 40px;
  }
  .logo-mark {
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .logo-icon {
    width: 36px; height: 36px;
    border: 1px solid var(--accent); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .logo-icon::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(108,99,255,0.2), transparent);
  }
  .logo-icon svg { width: 18px; height: 18px; stroke: var(--accent); fill: none; stroke-width: 1.5; }
  .logo-name {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .logo-name span { color: var(--accent); font-style: italic; }
  .logo-sub {
    font-size: 13px; color: var(--muted);
    letter-spacing: 0.5px; text-align: center;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.4);
  }
  .card-title { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .card-sub { font-size: 14px; color: var(--muted); margin-bottom: 28px; }
  .field { margin-bottom: 18px; }
  label {
    display: block; font-size: 13px; font-weight: 500;
    color: var(--muted); margin-bottom: 8px;
    letter-spacing: 0.3px; text-transform: uppercase;
  }
  input {
    width: 100%; background: var(--bg);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 13px 16px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 15px;
    transition: border-color 0.2s, box-shadow 0.2s; outline: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,99,255,0.15); }
  input::placeholder { color: var(--muted); }

  .password-hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .strength-bar { height: 3px; background: var(--border); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .strength-fill { height: 100%; border-radius: 2px; transition: width 0.3s, background 0.3s; width: 0%; }

  .btn {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, var(--accent), #8b7eff);
    border: none; border-radius: 10px;
    color: #fff; font-family: 'Syne', sans-serif;
    font-size: 15px; font-weight: 700; cursor: pointer;
    margin-top: 8px; transition: opacity 0.2s, transform 0.15s;
    letter-spacing: 0.3px;
  }
  .btn:hover { opacity: 0.92; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-loader {
    display: none; width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .alert { padding: 12px 16px; border-radius: 8px; font-size: 13.5px; margin-bottom: 18px; display: none; }
  .alert.error { background: rgba(255,101,132,0.1); border: 1px solid rgba(255,101,132,0.3); color: var(--error); }
  .alert.success { background: rgba(67,233,123,0.1); border: 1px solid rgba(67,233,123,0.3); color: var(--success); }

  .divider { text-align: center; margin: 24px 0; position: relative; color: var(--muted); font-size: 13px; }
  .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: var(--border); }
  .divider::before { left: 0; } .divider::after { right: 0; }

  .link-row { text-align: center; font-size: 14px; color: var(--muted); }
  .link-row a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .link-row a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="container">

  <div class="logo">
    <div class="logo-mark">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      </div>
      <div class="logo-name">Resume<span>AI</span></div>
    </div>
    <div class="logo-sub">AI-powered resume rewriter</div>
  </div>

  <div class="card">
    <div class="card-title">Create account</div>
    <div class="card-sub">Start rewriting your resume with AI</div>

    <div class="alert" id="alert"></div>

    <div class="field">
      <label>Full name</label>
      <input type="text" id="name" placeholder="Jane Smith" autocomplete="name"/>
    </div>
    <div class="field">
      <label>Email address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Min. 8 characters" autocomplete="new-password" oninput="checkStrength(this.value)"/>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      <div class="password-hint" id="strengthLabel"></div>
    </div>

    <button class="btn" id="regBtn" onclick="doRegister()">
      <span id="btnText">Create Account</span>
      <div class="btn-loader" id="loader"></div>
    </button>

    <div class="divider">or</div>
    <div class="link-row">Already have an account? <a href="/login.html">Sign in</a></div>
  </div>
</div>

<script>
  function checkStrength(pw) {
    const fill = document.getElementById('strengthFill');
    const label = document.getElementById('strengthLabel');
    let score = 0;
    if (pw.length >= 8) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    const levels = [
      { pct: '0%',   color: '#1e1e2e', text: '' },
      { pct: '25%',  color: '#ff6584', text: 'Weak' },
      { pct: '50%',  color: '#ffb347', text: 'Fair' },
      { pct: '75%',  color: '#43e97b', text: 'Good' },
      { pct: '100%', color: '#43e97b', text: 'Strong ✓' },
    ];
    const l = levels[score];
    fill.style.width = l.pct;
    fill.style.background = l.color;
    label.textContent = l.text;
    label.style.color = l.color;
  }

  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doRegister();
  });

  async function doRegister() {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const alertEl = document.getElementById('alert');
    const btn = document.getElementById('regBtn');
    const btnText = document.getElementById('btnText');
    const loader = document.getElementById('loader');

    alertEl.style.display = 'none';

    if (!name || !email || !password) { showAlert('error', 'All fields are required.'); return; }
    if (password.length < 8) { showAlert('error', 'Password must be at least 8 characters.'); return; }

    btn.disabled = true;
    btnText.style.display = 'none';
    loader.style.display = 'block';

    try {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      window.location.href = '/dashboard.html';
    } catch (e) {
      showAlert('error', e.message || 'Registration failed. Please try again.');
      btn.disabled = false;
      btnText.style.display = 'block';
      loader.style.display = 'none';
    }
  }

  function showAlert(type, msg) {
    const el = document.getElementById('alert');
    el.textContent = msg;
    el.className = 'alert ' + type;
    el.style.display = 'block';
  }
</script>
</body>
</html>
